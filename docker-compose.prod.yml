# Production Docker Compose — Open Pay on a shared host.
#
# Designed to run on a SHARED host alongside other projects without conflicts:
#   * Its own project namespace (name: openpay) and private network (openpay-net).
#   * Redis and NATS are bundled here and NOT published to the host.
#   * Postgres and object storage come from the host's shared platform stack
#     (/opt/platform): platform-postgres and platform-garage on the external
#     `platform` network. Only the services that use them join that network.
#   * Databases are prefixed (openpay_<service>) and owned by one non-superuser
#     role; the bucket is private and files are served through the gateway.
#   * ONLY the gateway is published, bound to 127.0.0.1:${GATEWAY_BIND_PORT:-7000}.
#     A host reverse proxy (nginx) terminates TLS and proxies to it.
#
# Usage on the VPS (wrapped by ./deploy.sh production):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: openpay

networks:
  openpay:
    name: openpay-net
  # Shared data services; created by the platform stack, not by this file.
  platform:
    name: ${PLATFORM_NETWORK:-platform}
    external: true

volumes:
  openpay_redis_data:
  openpay_nats_data:

# Database connection. Each service connects to
# DB_NAME_PREFIX + <service> + DB_NAME_SUFFIX, e.g. openpay_payment.
x-db-env: &db-env
  DB_HOST: ${DB_HOST:-platform-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:?set DB_USER in the env file}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the env file}
  DB_NAME_PREFIX: ${DB_NAME_PREFIX:?set DB_NAME_PREFIX in the env file}
  DB_NAME_SUFFIX: ${DB_NAME_SUFFIX:-}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  # Nine services share one role; keep their pools under its connection limit.
  DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-5}

# Object storage (S3-compatible). The bucket must exist and stay private.
x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://platform-garage:3900}
  S3_REGION: ${S3_REGION:-garage}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the env file}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the env file}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the env file}

services:
  # ───────────────────────── Infrastructure ─────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - openpay_redis_data:/data
    networks: [openpay]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    command: ["--js", "--sd", "/data", "--http_port", "8222"]
    volumes:
      - openpay_nats_data:/data
    networks: [openpay]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Migrations (one-shot; runs on the platform network, then exits) ───
  migrate:
    image: migrate/migrate:latest
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "/docker-migrate.sh"]
    environment:
      <<: *db-env
    volumes:
      - ./migrations:/migrations
      - ./scripts/docker-migrate.sh:/docker-migrate.sh:ro
    networks: [openpay, platform]

  # ───────────────────────── Application ─────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: gateway
    # Published ONLY on loopback; the host nginx reverse-proxies to it.
    ports:
      - "127.0.0.1:${GATEWAY_BIND_PORT:-7000}:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      MERCHANT_SERVICE_URL: http://merchant:8082
      PAYMENT_SERVICE_URL: http://payment:8081
      EXCHANGE_SERVICE_URL: http://exchange:8085
      SETTLEMENT_SERVICE_URL: http://settlement:8083
      WEBHOOK_SERVICE_URL: http://webhook:8084
      SUBSCRIPTION_SERVICE_URL: http://subscription:8086
      NOTIFICATION_SERVICE_URL: http://notification:8087
      ADMIN_SERVICE_URL: http://admin:8088
      DIRECTDEBIT_SERVICE_URL: http://directdebit:8089
      REDIS_URL: redis://redis:6379
    networks: [openpay]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  payment:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: payment
    environment:
      <<: *db-env
      PORT: "8081"
      JWT_SECRET: ${JWT_SECRET}
      EXCHANGE_SERVICE_URL: http://exchange:8085
      MERCHANT_SERVICE_URL: http://merchant:8082
      ADMIN_SERVICE_URL: http://admin:8088
      SETTLEMENT_SERVICE_URL: http://settlement:8083
      MERCHANT_PORTAL_URL: ${MERCHANT_PORTAL_URL}
      # On-chain scan-and-send (BSC testnet). Empty mnemonic disables it.
      RPC_URL: ${RPC_URL:-https://bsc-testnet-rpc.publicnode.com}
      CHAIN_ID: ${CHAIN_ID:-97}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x6c904e10631e199134891158B97311ed088A6a16}
      USDT_ADDRESS: ${USDT_ADDRESS:-0x5fB234eceBE3475E51F2A76bCE4a5d446D37CAB1}
      DEPOSIT_MASTER_MNEMONIC: ${DEPOSIT_MASTER_MNEMONIC:-}
      PAYMENT_CONFIRMATIONS: ${PAYMENT_CONFIRMATIONS:-3}
      WATCHER_POLL_INTERVAL: ${WATCHER_POLL_INTERVAL:-15s}
    networks: [openpay, platform]
    restart: unless-stopped

  merchant:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: merchant
    environment:
      <<: [*db-env, *s3-env]
      PORT: "8082"
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification:8087
      ADMIN_SERVICE_URL: http://admin:8088
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    networks: [openpay, platform]
    restart: unless-stopped

  settlement:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: settlement
    environment:
      <<: *db-env
      PORT: "8083"
      JWT_SECRET: ${JWT_SECRET}
    networks: [openpay, platform]
    restart: unless-stopped

  webhook:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: webhook
    environment:
      <<: *db-env
      PORT: "8084"
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats:4222
    networks: [openpay, platform]
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  exchange:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: exchange
    environment:
      <<: *db-env
      PORT: "8085"
      JWT_SECRET: ${JWT_SECRET}
    networks: [openpay, platform]
    restart: unless-stopped

  subscription:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: subscription
    environment:
      <<: *db-env
      PORT: "8086"
      JWT_SECRET: ${JWT_SECRET}
    networks: [openpay, platform]
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: notification
    environment:
      <<: *db-env
      PORT: "8087"
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats:4222
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    networks: [openpay, platform]
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: admin
    environment:
      <<: [*db-env, *s3-env]
      PORT: "8088"
      JWT_SECRET: ${JWT_SECRET}
    networks: [openpay, platform]
    restart: unless-stopped

  directdebit:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: directdebit
    environment:
      <<: *db-env
      PORT: "8089"
      JWT_SECRET: ${JWT_SECRET}
    networks: [openpay, platform]
    restart: unless-stopped
