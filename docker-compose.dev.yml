# Containerized development stack — Go services (hot reload) + frontends.
#
# Always used together with the base infra file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The Makefile wraps this:  make up  ->  make migrate  ->  make start
# Only Docker is required on the host.

x-go-service: &go-service
  build:
    context: .
    dockerfile: Dockerfile.dev.api
  volumes:
    - ./:/app
    - go-build-cache:/root/.cache/go-build
  restart: unless-stopped

x-go-env: &go-env
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-min32chars}
  LOG_LEVEL: ${LOG_LEVEL:-info}

# Database connection for services with a database. Each service connects
# to DB_NAME_PREFIX + <service> + DB_NAME_SUFFIX, i.e. <service>_db here.
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: olp
  DB_PASSWORD: ${POSTGRES_PASSWORD:-olp_dev_password}
  DB_NAME_PREFIX: ""
  DB_NAME_SUFFIX: _db
  DB_SSLMODE: disable

services:
  # ─── API Gateway ───
  gateway:
    <<: *go-service
    environment:
      <<: *go-env
      SERVICE: gateway
      PORT: "8080"
      MERCHANT_SERVICE_URL: http://merchant:8082
      PAYMENT_SERVICE_URL: http://payment:8081
      EXCHANGE_SERVICE_URL: http://exchange:8085
      SETTLEMENT_SERVICE_URL: http://settlement:8083
      WEBHOOK_SERVICE_URL: http://webhook:8084
      SUBSCRIPTION_SERVICE_URL: http://subscription:8086
      NOTIFICATION_SERVICE_URL: http://notification:8087
      ADMIN_SERVICE_URL: http://admin:8088
      DIRECTDEBIT_SERVICE_URL: http://directdebit:8089
      REDIS_URL: redis://redis:6379
    ports:
      - "7000:8080"
    depends_on:
      redis:
        condition: service_healthy

  # ─── Payment ───
  payment:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: payment
      PORT: "8081"
      EXCHANGE_SERVICE_URL: http://exchange:8085
      MERCHANT_SERVICE_URL: http://merchant:8082
      ADMIN_SERVICE_URL: http://admin:8088
      SETTLEMENT_SERVICE_URL: http://settlement:8083
      MERCHANT_PORTAL_URL: ${MERCHANT_PORTAL_URL:-http://localhost:7010}
      # On-chain scan-and-send (BSC testnet). Empty mnemonic disables it.
      RPC_URL: ${RPC_URL:-https://bsc-testnet-rpc.publicnode.com}
      CHAIN_ID: ${CHAIN_ID:-97}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x6c904e10631e199134891158B97311ed088A6a16}
      USDT_ADDRESS: ${USDT_ADDRESS:-0x5fB234eceBE3475E51F2A76bCE4a5d446D37CAB1}
      DEPOSIT_MASTER_MNEMONIC: ${DEPOSIT_MASTER_MNEMONIC:-}
      PAYMENT_CONFIRMATIONS: ${PAYMENT_CONFIRMATIONS:-3}
      WATCHER_POLL_INTERVAL: ${WATCHER_POLL_INTERVAL:-15s}
    ports:
      - "7001:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Merchant ───
  merchant:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: merchant
      PORT: "8082"
      NOTIFICATION_SERVICE_URL: http://notification:8087
      ADMIN_SERVICE_URL: http://admin:8088
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_BUCKET: kyc-documents
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ${SMTP_FROM:-noreply@openlankapay.dev}
    ports:
      - "7002:8082"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Settlement ───
  settlement:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: settlement
      PORT: "8083"
    ports:
      - "7003:8083"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Webhook ───
  webhook:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: webhook
      PORT: "8084"
      NATS_URL: nats://nats:4222
    ports:
      - "7004:8084"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ─── Exchange ───
  exchange:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: exchange
      PORT: "8085"
    ports:
      - "7005:8085"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Subscription ───
  subscription:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: subscription
      PORT: "8086"
    ports:
      - "7006:8086"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Notification ───
  notification:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: notification
      PORT: "8087"
      NATS_URL: nats://nats:4222
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ${SMTP_FROM:-noreply@openlankapay.dev}
    ports:
      - "7007:8087"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ─── Admin ───
  admin:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: admin
      PORT: "8088"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      S3_BUCKET: kyc-documents
    ports:
      - "7008:8088"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Direct Debit ───
  directdebit:
    <<: *go-service
    environment:
      <<: [*go-env, *db-env]
      SERVICE: directdebit
      PORT: "8089"
    ports:
      - "7009:8089"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend: Merchant Portal ───
  merchant-portal:
    build:
      context: .
      dockerfile: Dockerfile.dev.web
    command: sh -c "pnpm install && pnpm dev"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:7000}
      VITE_USE_POLLING: "true"
      # Keep pnpm's content store inside the named volume, not the bind mount,
      # so nothing leaks into the host working tree.
      npm_config_store_dir: /app/node_modules/.pnpm-store
    volumes:
      - ./apps/merchant-portal:/app
      - merchant-portal-modules:/app/node_modules
    ports:
      - "7010:7010"
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── Frontend: Admin Dashboard ───
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev.web
    command: sh -c "pnpm install && pnpm dev"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:7000}
      VITE_USE_POLLING: "true"
      # Keep pnpm's content store inside the named volume, not the bind mount,
      # so nothing leaks into the host working tree.
      npm_config_store_dir: /app/node_modules/.pnpm-store
    volumes:
      - ./apps/admin-dashboard:/app
      - admin-dashboard-modules:/app/node_modules
    ports:
      - "7011:7011"
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── Migrations (one-shot tool; run via `make migrate`) ───
  migrate:
    image: migrate/migrate:latest
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "/docker-migrate.sh"]
    environment:
      <<: *db-env
    volumes:
      - ./migrations:/migrations
      - ./scripts/docker-migrate.sh:/docker-migrate.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  go-build-cache:
  merchant-portal-modules:
  admin-dashboard-modules:
